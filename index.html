<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D ⇄ 3D — Engine Prototype</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05070d;overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;color:#cfe6ff;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
    transition:opacity .35s ease}
  #c3d{opacity:0;pointer-events:none;touch-action:none}

  #overlay{position:fixed;inset:0;background:#000;opacity:1;z-index:10;
    pointer-events:none;transition:opacity .6s ease}

  #hint{position:fixed;left:50%;top:14%;transform:translateX(-50%);
    z-index:6;pointer-events:none;font-size:20px;letter-spacing:.04em;
    opacity:0;transition:opacity .4s;text-shadow:0 0 24px #4af;white-space:nowrap}
  #hint.show{opacity:1}

  #hud{position:fixed;left:16px;bottom:14px;z-index:5;font-size:13px;
    opacity:.6;letter-spacing:.03em}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="stage">
  <canvas id="c2d"></canvas>
  <canvas id="c3d"></canvas>
</div>

<div id="hint"></div>
<div id="hud"></div>
<div id="overlay"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
