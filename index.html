<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ISKRA · ИСКРА — Level 1 Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #04060c;
    overflow: hidden;
    font-family: ui-monospace, "Courier New", monospace;
    color: #e0d8c0;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    transition: opacity .35s ease;
    touch-action: none;
  }
  #c3d { opacity: 0; pointer-events: none; }

  #overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 1;
    z-index: 10;
    pointer-events: none;
    transition: opacity .6s ease;
  }

  #hint {
    position: fixed;
    left: 50%;
    top: 11%;
    transform: translateX(-50%);
    z-index: 6;
    pointer-events: none;
    font-size: 15px;
    letter-spacing: .06em;
    opacity: 0;
    transition: opacity .4s;
    text-shadow: 0 0 20px rgba(212, 168, 67, 0.8), 0 0 8px rgba(79, 240, 255, 0.5);
    text-align: center;
    max-width: 90vw;
    padding: 8px 20px;
    line-height: 1.4;
    color: #e8dcc0;
    border-top: 1px solid rgba(212, 168, 67, 0.4);
    border-bottom: 1px solid rgba(212, 168, 67, 0.4);
    background: linear-gradient(90deg, transparent 0%, rgba(10, 10, 20, 0.7) 20%, rgba(10, 10, 20, 0.7) 80%, transparent 100%);
  }
  @media (min-width: 768px) {
    #hint { font-size: 17px; letter-spacing: .08em; }
  }
  #hint.show { opacity: 1; }
  #hint::before, #hint::after {
    content: '◆';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #d4a843;
    font-size: 10px;
    opacity: 0.7;
  }
  #hint::before { left: 6px; }
  #hint::after { right: 6px; }

  #hud {
    position: fixed;
    left: 16px;
    bottom: 14px;
    z-index: 5;
    font-size: 11px;
    opacity: .65;
    letter-spacing: .06em;
    max-width: 60vw;
    line-height: 1.4;
    color: #d4a843;
    text-shadow: 0 0 8px rgba(212, 168, 67, 0.4);
  }
  @media (min-width: 768px) { #hud { font-size: 12px; max-width: none; } }

  /* Углы-обереги по краям экрана */
  #corner-frame {
    position: fixed;
    inset: 8px;
    z-index: 4;
    pointer-events: none;
  }
  #corner-frame::before,
  #corner-frame::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(212, 168, 67, 0.35);
  }
  #corner-frame::before {
    top: 0; left: 0;
    border-right: none; border-bottom: none;
    background:
      linear-gradient(135deg, transparent 45%, rgba(192, 32, 48, 0.6) 46%, rgba(192, 32, 48, 0.6) 50%, transparent 51%) no-repeat 6px 6px / 10px 10px;
  }
  #corner-frame::after {
    top: 0; right: 0;
    border-left: none; border-bottom: none;
    background:
      linear-gradient(225deg, transparent 45%, rgba(192, 32, 48, 0.6) 46%, rgba(192, 32, 48, 0.6) 50%, transparent 51%) no-repeat right 6px top 6px / 10px 10px;
  }

  /* ---- Dialogue — грамота ---- */
  #dialogue {
    position: fixed;
    left: 50%;
    bottom: 230px;
    transform: translateX(-50%);
    width: min(680px, 90vw);
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
  }
  #dialogue.dialogue-hidden {
    opacity: 0;
    transform: translate(-50%, 12px);
  }
  #dialogue:not(.dialogue-hidden) {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .dialogue-box {
    background:
      linear-gradient(180deg, rgba(30, 24, 16, 0.94) 0%, rgba(15, 12, 8, 0.96) 100%);
    border: 2px solid rgba(212, 168, 67, 0.7);
    border-radius: 4px;
    padding: 18px 26px 14px;
    box-shadow:
      0 0 50px rgba(212, 168, 67, 0.2),
      inset 0 0 30px rgba(212, 168, 67, 0.08),
      inset 0 0 0 1px rgba(192, 32, 48, 0.3);
    position: relative;
  }
  .dialogue-box::before, .dialogue-box::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1px solid rgba(192, 32, 48, 0.7);
  }
  .dialogue-box::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .dialogue-box::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .dialogue-speaker {
    color: #d4a843;
    font-size: 12px;
    letter-spacing: 0.24em;
    margin-bottom: 12px;
    font-weight: bold;
    text-shadow: 0 0 12px rgba(212, 168, 67, 0.8);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dialogue-speaker::before, .dialogue-speaker::after {
    content: '◆';
    color: #c02030;
    font-size: 8px;
    opacity: 0.8;
  }
  .dialogue-speaker::after {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(192, 32, 48, 0.6) 0%, transparent 100%);
    color: transparent;
    position: relative;
  }
  .dialogue-text {
    color: #e8dcc0;
    font-size: 15px;
    line-height: 1.55;
    min-height: 56px;
    text-shadow: 0 0 10px rgba(212, 168, 67, 0.2);
    font-family: ui-monospace, "Courier New", monospace;
    letter-spacing: 0.02em;
  }
  .dialogue-hint {
    color: rgba(212, 168, 67, 0.65);
    font-size: 10px;
    margin-top: 12px;
    text-align: right;
    letter-spacing: 0.14em;
  }
  @media (max-width: 600px) {
    #dialogue { bottom: 200px; }
    .dialogue-box { padding: 14px 18px 10px; }
    .dialogue-text { font-size: 13px; min-height: 48px; }
    .dialogue-speaker { font-size: 11px; letter-spacing: 0.18em; }
  }

  /* ---- Mobile UI ---- */
  #mobile-ui {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: none;
  }
  #mobile-ui.visible { display: block; }

  #joystick-container {
    position: absolute;
    left: max(20px, env(safe-area-inset-left, 20px));
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    pointer-events: auto;
    touch-action: none;
  }
  #joystick-base {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 168, 67, 0.12) 0%, rgba(120, 60, 20, 0.15) 100%);
    border: 2px solid rgba(212, 168, 67, 0.5);
    position: relative;
    touch-action: none;
    box-shadow: 0 0 24px rgba(212, 168, 67, 0.2), inset 0 0 20px rgba(120, 60, 20, 0.2);
  }
  #joystick-thumb {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(212, 168, 67, 0.85) 0%, rgba(150, 90, 30, 0.9) 100%);
    border: 2px solid rgba(212, 168, 67, 0.9);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 18px rgba(212, 168, 67, 0.7), inset 0 0 12px rgba(255, 220, 100, 0.3);
    pointer-events: none;
  }

  #action-buttons {
    position: absolute;
    right: max(20px, env(safe-area-inset-right, 20px));
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    display: flex;
    gap: 14px;
    pointer-events: auto;
    flex-direction: row-reverse;
  }
  .action-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 168, 67, 0.2) 0%, rgba(120, 60, 20, 0.25) 100%);
    border: 2px solid rgba(212, 168, 67, 0.6);
    color: #d4a843;
    font-size: 24px;
    font-weight: bold;
    font-family: ui-monospace, "Courier New", monospace;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 20px rgba(212, 168, 67, 0.25);
    transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
    position: relative;
  }
  .action-btn::before {
    content: '◆';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(192, 32, 48, 0.6);
    font-size: 8px;
  }
  .action-btn.active {
    transform: scale(0.92);
    background: radial-gradient(circle, rgba(212, 168, 67, 0.55) 0%, rgba(180, 100, 30, 0.6) 100%);
    box-shadow: 0 0 32px rgba(212, 168, 67, 0.7);
  }
  .action-btn[data-action="F"] {
    background: radial-gradient(circle, rgba(255, 220, 100, 0.2) 0%, rgba(160, 90, 20, 0.3) 100%);
    border-color: rgba(255, 220, 100, 0.6);
    color: #ffdd66;
    box-shadow: 0 0 20px rgba(255, 220, 100, 0.3);
  }
  .action-btn[data-action="F"].active {
    background: radial-gradient(circle, rgba(255, 220, 100, 0.6) 0%, rgba(200, 130, 30, 0.7) 100%);
    box-shadow: 0 0 32px rgba(255, 220, 100, 0.8);
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="stage">
  <canvas id="c2d"></canvas>
  <canvas id="c3d"></canvas>
</div>

<div id="corner-frame"></div>
<div id="hint"></div>
<div id="hud"></div>
<div id="overlay"></div>

<div id="dialogue" class="dialogue-hidden">
  <div class="dialogue-box">
    <div class="dialogue-speaker">—</div>
    <div class="dialogue-text"></div>
    <div class="dialogue-hint">E — далее</div>
  </div>
</div>

<div id="mobile-ui">
  <div id="joystick-container">
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>
  <div id="action-buttons">
    <button class="action-btn" data-action="F" aria-label="Бросить клубок">F</button>
    <button class="action-btn" data-action="E" aria-label="Действие">E</button>
  </div>
</div>

<script type="module" src="./main.js?v=8"></script>
</body>
</html>
